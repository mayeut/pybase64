name: Benchmark

on:
  push:
    branches:
      - main
      - master
      - "temp/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark ${{ matrix.archs }} ${{ matrix.build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        archs: ["x86_64"]
        build: ["manylinux"]
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup uv & nox
        uses: ./.github/actions/setup-uv-nox
      - name: Build wheel
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"
          CIBW_BUILD: "cp312-${{ matrix.build }}*"
      - name: Install dependencies
        run: nox -s benchmark --install-only -- --wheel wheelhouse/*.whl
      - name: Run benchmark
        uses: CodSpeedHQ/action@9d332c4d90b43981c3e55ae8e38e68709996240f # v4.17.0
        with:
          mode: simulation
          run: nox -s benchmark --reuse-existing-virtualenvs --no-install -- -v
