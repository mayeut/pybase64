name: Coverage

on:
  push:
    branches:
      - main
      - master
      - "temp/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on: [ "ubuntu-26.04", "ubuntu-26.04-arm" ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup uv & nox
        uses: ./.github/actions/setup-uv-nox
      - name: Install Intel SDE
        if: runner.arch == 'X64'
        run: |
          # https://downloadmirror.intel.com/915934/sde-external-10.8.0-2026-03-15-lin.tar.xz
          # https://github.com/nihui/ncnn-assets/releases/download/toolchain/sde-external-10.8.0-2026-03-15-lin.tar.xz
          curl -fsSLo ${HOME}/sde.tar.xz https://github.com/petarpetrovt/setup-sde/releases/download/binaries/sde-external-10.8.0-2026-03-15-lin.tar.xz
          echo "50b320cd226acef7a491f5b321fc1be3c3c7984f9e27a456e64894b5b0979dd3  ${HOME}/sde.tar.xz" | sha256sum -c -
          mkdir ${HOME}/sde
          tar -C ${HOME}/sde --strip-components 1 -xf ${HOME}/sde.tar.xz
          echo "PATH=${HOME}/sde:${PATH}" >> $GITHUB_ENV
      - name: Install libxml2-dev & libxslt1-dev
        run: |
          # as long as lxml does not provide 3.15 wheels
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: Run coverage tests
        run: nox -s coverage -- --with-sde
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.runs-on }}
          path: |
            coverage-native-*.xml
            coverage-python-*.xml
          retention-days: 1

  coverage_report:
    name: Coverage Report
    needs: ["coverage"]
    runs-on: ubuntu-slim
    permissions:
      id-token: write  # upload to codecov with OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true

  check_coverage:
    if: always()
    name: Check coverage
    needs: [coverage_report]
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
