name: Setup uv & nox
description: Setup uv & nox

runs:
  using: "composite"
  steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          python-version: "3.12"
      - name: Install nox
        run: uv sync --frozen --only-group nox
        shell: bash
